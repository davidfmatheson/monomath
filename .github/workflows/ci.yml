name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Restore cached npm dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            ~/.cache/Cypress # needed for the Cypress binary
          key: npm-dependencies-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Cache npm dependencies
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            ~/.cache/Cypress # needed for the Cypress binary
          key: npm-dependencies-${{ hashFiles('package-lock.json') }}
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}
      - name: Determine affected base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -z "$LAST_TAG" ]; then
              echo "No previous tag found; using the repo's first commit as the affected base"
              BASE=$(git rev-list --max-parents=0 HEAD)
            else
              echo "Using last successful tag as affected base: $LAST_TAG"
              BASE="$LAST_TAG"
            fi
          else
            BASE="main"
          fi
          echo "NX_BASE=$BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npx nx affected -t lint test build --parallel=3
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          TAG_PREFIX: v
      - name: Configure AWS Credentials
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy static site to S3 bucket
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: aws s3 sync ./dist/apps/micah-site/browser s3://micahmatheson.com --delete
